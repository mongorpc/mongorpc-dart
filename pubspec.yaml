name: mongorpc
description: A dart client for mongorpc. (mongorpc is a server that can be used to communicate with MongoDB using gRPC. mongorpc can be used with microservices, or from any mobile or web applications.)
version: 0.0.1
homepage: https://github.com/mongorpc/mongorpc-dart
repository: https://github.com/mongorpc/mongorpc-dart

environment:
  sdk: ">=2.14.4 <3.0.0"

dependencies:
  fixnum: ^1.0.0
  grpc: ^3.0.2
  protobuf: ^2.0.0

dev_dependencies:
  lints: ^1.0.0
  test: ^1.19.4
